name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI logic lives in tests/Invoke-CI.ps1 so it can change without editing this file.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: ./tests/Invoke-CI.ps1 -Task Lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Mock tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Invoke-CI.ps1 -Task Test
      - name: Mock tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Invoke-CI.ps1 -Task Test
